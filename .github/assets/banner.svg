<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="OLEXANDER">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#0369a1" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#06090f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="36" y="76" height="134.0" width="0">
        <animate attributeName="width" values="0;656.0;656.0" dur="3.4s" keyTimes="0;0.72;1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="250" rx="16" fill="#06090f"/>
  <rect x="1" y="1" width="898" height="248" rx="16" fill="#080e17" stroke="url(#edge)" stroke-width="1.6"/>
  <rect x="1" y="1" width="898" height="248" rx="16" fill="url(#sheen)"/>
  <circle cx="26" cy="26" r="5" fill="#ef4444" opacity=".85"/>
