    <text x="40" y="130" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" xml:space="preserve" fill="#22d3ee" opacity=".92">█   █ █     █      █ █  █   █ █ █ █ █   █ █     █   █ </text>
    <text x="40" y="148" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" xml:space="preserve" fill="#22d3ee" opacity=".92">█   █ █     ████    █   █████ █  ██ █   █ ████  ████  </text>
    <text x="40" y="166" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" xml:space="preserve" fill="#22d3ee" opacity=".92">█   █ █     █      █ █  █   █ █   █ █   █ █     █ █   </text>
    <text x="40" y="184" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" xml:space="preserve" fill="#22d3ee" opacity=".92">█   █ █     █     █   █ █   █ █   █ █   █ █     █  █  </text>
    <text x="40" y="202" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" xml:space="preserve" fill="#22d3ee" opacity=".92"> ███  █████ █████ █   █ █   █ █   █ ████  █████ █   █ </text>
