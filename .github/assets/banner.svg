  <circle cx="60" cy="26" r="5" fill="#22c55e" opacity=".85"/>
  <text x="86" y="30" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#5b7085">IDENTITY</text>
