  </rect>
  <text x="40" y="228" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5b7085">Agentic Engineer <tspan fill="#12283a">|</tspan> <tspan fill="#7dd3fc" opacity=".8">Coimbra, Portugal</tspan></text>
